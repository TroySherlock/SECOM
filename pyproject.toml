[project]
name = "secom"
version = "0.1.0"
description = "SECOM semiconductor defect detection — dbt, ML pipelines, Streamlit dashboard"
requires-python = ">=3.11"
dependencies = [
    "dbt-duckdb",
    "dcor",
    "duckdb",
    "feature-engine",
    "ipykernel",
    "numpyro",
    "pandas",
    "plotly",
    "pyHSICLasso",
    "pymc",
    "scikit-learn",
    "shap",
    "streamlit>=1.47",
    "tqdm",
    "tqdm-joblib",
    "xgboost",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secom"]

[tool.hatch.build.targets.sdist]
only-include = ["src/secom", "pyproject.toml"]
