[project]
name = "secom"
version = "0.1.0"
description = "SECOM semiconductor defect detection — dbt, ML pipelines, Streamlit dashboard"
requires-python = ">=3.11"
dependencies = [
    "dbt-duckdb",
    "duckdb",
    "feature-engine",
    "ipykernel",
    "numpyro",
    "pandas",
    "plotly",
    "pyHSICLasso",
    "pymc",
    "scikit-learn",
    "shap",
    "streamlit>=1.47",
    "tqdm",
    "tqdm-joblib",
]

[project.optional-dependencies]
dev = ["ruff", "vulture", "pytest"]

[project.scripts]
secom-build-seed = "secom.cli.build_seed:main"
secom-build-narratives = "secom.cli.build_narratives:main"
secom-tune = "secom.cli.run_tuning:main"
secom-benchmark = "secom.cli.benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secom"]

[tool.hatch.build.targets.sdist]
only-include = ["src/secom", "pyproject.toml"]

[tool.ruff.lint]
select = ["F", "I"]  # pyflakes (unused imports/vars) + import sorting
