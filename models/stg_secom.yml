version: 2

models:
  - name: stg_secom
    description: >
      Parsed measurement timestamps, pass/fail target, and 590 raw sensor columns (c_0 … c_589).
      Feeds int_secom_features for calendar encoding and downstream sensor profiling.
    columns:
      - name: raw_row_id
        description: Stable source-file row order (timestamp tiebreaker).
        tests:
          - not_null
          - unique
      - name: measurement_ts
        description: Parsed measurement time from raw timestamp string.
        tests:
          - not_null
      - name: target
        description: "0 = pass, 1 = fail."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
