version: 2

seeds:
  - name: raw_secom
    description: >
      Merged UCI SECOM labels and 590 sensor columns (c_0 … c_589), built by
      `python -m secom.cli.build_seed` from data/secom_labels.data and data/secom.data.
    columns:
      - name: raw_row_id
        description: >
          Stable source-file row order; deterministic tiebreaker for rows that
          share the same measurement timestamp.
        tests:
          - not_null
          - unique
      - name: target
        description: "0 = pass, 1 = fail (mapped from UCI -1/1 labels)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: timestamp
        description: Raw measurement timestamp string; parsed in stg_secom.
        tests:
          - not_null
