secom_profile: # Matches the profile name in dbt_project.yml
  target: dev
  outputs:
    dev:
      type: duckdb
      path: secom.duckdb
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      port: 5432
      dbname: secom_db
      schema: public
      threads: 12
